services:
  - type: web
    name: artificial-human-monitor-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: pip install .
    startCommand: uvicorn artificial_human.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: ARTIFICIAL_HUMAN_PUBLIC_DEPLOYMENT
        value: "true"
      - key: ARTIFICIAL_HUMAN_MONITOR_ONLY
        value: "true"
      - key: ARTIFICIAL_HUMAN_API_TOKEN
        generateValue: true
      - key: ARTIFICIAL_HUMAN_INTERACTIVE_MODE
        value: "true"
      - key: ARTIFICIAL_HUMAN_AUTH_USERNAME
        value: "aakash"
      - key: ARTIFICIAL_HUMAN_AUTH_PASSWORD_HASH
        sync: false
      - key: ARTIFICIAL_HUMAN_AUTH_SESSION_SECRET
        generateValue: true
      - key: ARTIFICIAL_HUMAN_AUTH_ORIGIN
        value: "https://artificial-human-control-room.vercel.app"
      - key: ARTIFICIAL_HUMAN_WEBAUTHN_RP_ID
        value: "artificial-human-control-room.vercel.app"
      - key: ARTIFICIAL_HUMAN_CORS_ORIGINS
        sync: false
