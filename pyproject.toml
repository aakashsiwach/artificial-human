[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "artificial-human"
version = "0.1.0"
description = "A consent-first experimental artificial organism and personal cognitive system."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Aakash Siwach" }]
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.8,<1.0", "mypy>=1.13,<2.0", "httpx>=0.27,<1.0"]

[project.scripts]
artificial-human = "artificial_human.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/artificial_human"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_unused_ignores = true
