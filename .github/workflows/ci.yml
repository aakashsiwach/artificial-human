name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Tests
        run: pytest --cov=artificial_human --cov-report=term-missing
      - name: CLI simulation
        run: artificial-human simulate
      - name: Memory retrieval benchmark (offline, lexical variants)
        run: artificial-human memory-eval --backend none --output-dir benchmark-output
      - name: Cognitive evaluation (offline, deterministic, no LLM or model download)
        run: artificial-human cognition-eval --suite all --output-dir benchmark-output
      - name: Upload offline benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: offline-benchmarks-py${{ matrix.python-version }}
          path: benchmark-output/

  # Real semantic retrieval benchmark. It downloads the open embedding model
  # weights once (cached) and is separate from the network-free test suite.
  memory-benchmark:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with semantic extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,semantic]"
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .artificial-human/models
          key: fastembed-bge-small-en-v1.5
      - name: Tests with the semantic extra installed
        run: pytest -q
      - name: Full memory retrieval benchmark
        run: artificial-human memory-eval --backend fastembed --output-dir benchmark-output
      - name: Cognitive evaluation with semantic variants (local model)
        run: artificial-human cognition-eval --suite all --embedding-backend fastembed --output-dir benchmark-output
      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: memory-retrieval-benchmark
          path: benchmark-output/
